name: Deploy MoneyFlow Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Export web
        run: npx expo export -p web
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_SUPABASE_URL: https://afltanlcwjhdweyvukjq.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmbHRhbmxjd2poZHdleXZ1a2pxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNDgzMDMsImV4cCI6MjEwODkyNDMwM30.xbT16dqHw-fdj4ovg302PN2wgVlKAbEtiuMQ96q7j8k
          EXPO_PUBLIC_DEFAULT_CURRENCY: KES

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
